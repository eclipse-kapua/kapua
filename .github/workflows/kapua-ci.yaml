name: Kapua CI
on: [ push, pull_request ] # Triggers the workflow on push or pull request events

env: #this env variable defines the maven projects of the consumers applications, needed to build the docker images when they cannot be loaded from the workflow artifacts. The maven projects with cucumber tests are detected by the runTestsTaggedAs action.
  APP_PROJECTS: "org.eclipse.kapua:kapua-service-authentication-app,org.eclipse.kapua:kapua-consumer-lifecycle-app,org.eclipse.kapua:kapua-consumer-telemetry-app"
  # Secrets
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  build:
    name: Build
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository # Checks out a copy of the repository on the runner
        uses: actions/checkout@v5
      - name: Set up runner
        uses: ./.github/actions/setUpRunner
      - name: Set up Maven caches
        uses: ./.github/actions/setUpMavenCaches
        with:
          kapua-artifact-cache-enabled: 'false'
      - name: Maven version
        run: mvn --version
      - name: Build Kapua project
        run: mvn -B -DskipTests clean install -T 1C
      - name: Save built Kapua Artifacts
        uses: ./.github/actions/saveBuiltKapuaArtifacts

  build-javadoc:
    needs: build
    name: Build Javadoc
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository # Checks out a copy of the repository on the runner
        uses: actions/checkout@v5
      - name: Set up runner
        uses: ./.github/actions/setUpRunner
      - name: Set up Maven caches
        uses: ./.github/actions/setUpMavenCaches
        with:
          kapua-artifact-cache-enabled: 'false'
      - name: Build Kapua Javadoc
        run: mvn -B -DskipTests install javadoc:jar

  build-docker:
    needs: build
    name: Build Docker
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository # Checks out a copy of the repository on the runner
        uses: actions/checkout@v5
      - name: Set up runner
        uses: ./.github/actions/setUpRunner
      - name: Set up Maven caches
        uses: ./.github/actions/setUpMavenCaches
      - name: Build Kapua Docker Images
        run: mvn -B -DskipTests install -f assembly -P docker
      - name: Result
        run: docker images | sort
      - name: Save Kapua Docker Images # Loaded by the test jobs instead of building them again
        uses: ./.github/actions/saveDockerImages
        with:
          artifact-name: kapua-docker-images
          images: >-
            eclipsekapua/kapua-sql
            eclipsekapua/kapua-events-broker
            eclipsekapua/kapua-broker-artemis
            eclipsekapua/kapua-job-engine
            eclipsekapua/kapua-service-authentication
            eclipsekapua/kapua-consumer-lifecycle
            eclipsekapua/kapua-consumer-telemetry
      - name: Save Kapua rest-api Docker Image # Saved apart since only the REST API test jobs need it
        uses: ./.github/actions/saveDockerImages
        with:
          artifact-name: kapua-api-docker-image
          images: eclipsekapua/kapua-api

  junit-tests:
    needs: build
    name: Run jUnit Tests
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository # Checks out a copy of the repository on the runner
        uses: actions/checkout@v5
      - name: Set up runner
        uses: ./.github/actions/setUpRunner
      - uses: ./.github/actions/runTestsTaggedAs
        with:
          needs-docker-images: 'false'
          run-junit: 'true'

  test-brokerAcl:
