name: 'Execute tests'
description: 'Execute tests suite for tests tagged as specified'
inputs:
  tag:
    description: Cucumber tag of the tests to run
    required: false
  needs-docker-images:
    description: true if this suite needs docker images, false otherwise. They are loaded from the artifact uploaded by the 'build-docker' job, which the job must depend on
    required: false
    default: 'true'
  needs-api-docker-image:
    description: true if this suite needs the rest-api docker image, false otherwise. It is loaded from the artifact uploaded by the 'build-docker' job, which the job must depend on
    required: false
    default: 'false'
  run-junit:
    description: true if you want to execute junit tests, false if you want to execute cucumber tests
    required: false
    default: 'false'
#outputs:
runs:
  using: "composite"
  steps:
    - name: Set up runner
      uses: ./.github/actions/setUpRunner

    - name: Set up Maven caches
      uses: ./.github/actions/setUpMavenCaches

    - name: Docker images loading # Images are built once by the 'build-docker' job
      if: ${{ inputs.needs-docker-images == 'true' }}
      uses: ./.github/actions/loadDockerImages
      with:
        artifact-name: kapua-docker-images
        fallback-build-command: >-
          mvn clean install -pl ${APP_PROJECTS} &&
          mvn clean install -Pdocker -f assembly/pom.xml -pl '!:kapua-assembly-api'

    - name: Docker rest-api image loading
      if: ${{ inputs.needs-api-docker-image == 'true' }}
      uses: ./.github/actions/loadDockerImages
      with:
        artifact-name: kapua-api-docker-image
        fallback-build-command: mvn clean install -Pdocker -pl :kapua-assembly-api

    - name: Cucumber tests execution step # Runs only the modules with Cucumber runners, detected so that new test modules are never left out
      if: ${{ inputs.run-junit == 'false' }}
      run: |
        TEST_PROJECTS=$(git grep -l '@CucumberOptions' -- '*/src/test/java/*.java' | sed 's|/src/test/java/.*||' | sort -u | paste -sd, -)
        echo "Modules with Cucumber tests: ${TEST_PROJECTS}"
        mvn -B -Dgroups='!org.eclipse.kapua.qa.markers.junit.JUnitTests' -Dcucumber.filter.tags="${{ inputs.tag }}" -pl "${TEST_PROJECTS}" verify
      shell: bash

    - name: Junit tests execution step
      if: ${{ inputs.run-junit == 'true' }}
      run: mvn -B -Dgroups='org.eclipse.kapua.qa.markers.junit.JUnitTests' verify
      shell: bash

    - name: Code coverage results upload
      uses: codecov/codecov-action@v6
