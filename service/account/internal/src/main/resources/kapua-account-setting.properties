account.eventAddress=account
#
# Local cache of accounts by name (@Named("accountsByNameCache")), shared by Translators to resolve account ids from account names.
# Entries are not invalidated when an account is updated or deleted: a changed account is returned as it was until its entry expires.
# Setting the size or the expiration time (in seconds) to 0 disables the cache.
account.cache.local.size.maximum=1000
account.cache.local.expire.after=60
#account.cache.local.expire.strategy=MODIFIED
